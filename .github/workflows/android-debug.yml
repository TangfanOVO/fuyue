name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install exact dependencies
        run: npm ci
      - name: Test public boundary and contracts
        env:
          PUBLIC_PRIVATE_MARKERS: ${{ secrets.PUBLIC_PRIVATE_MARKERS }}
        run: npm test && npm run check:privacy:release
      - name: Sync shared frontend into Android
        run: npm run android:sync
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fuyue-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Deploy PWA to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify source and build PWA
        env:
          PUBLIC_PRIVATE_MARKERS: ${{ secrets.PUBLIC_PRIVATE_MARKERS }}
        run: npm test && npm run check:privacy:release && npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy static PWA
        id: deployment
        uses: actions/deploy-pages@v4
